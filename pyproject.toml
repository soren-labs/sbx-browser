[project]
name = "sbx-browser"
version = "0.1.1"
description = "Cursor Cloud Agent-style Codex cloud sessions (browser + control plane + sandbox runner)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    # SOR-203: 0.76.0 introduced the autoscaler names the control app uses
    # (scaledown_window / min_containers / buffer_containers).
    "modal>=0.76.0",
    "pydantic>=2.10.0",
    "psycopg[binary]>=3.2.0,<4",
    # SOR-177: GitHub App authorization mints RS256 JWTs (App → installation
    # token) — [crypto] pulls in cryptography for RSA signing.
    "pyjwt[crypto]>=2.10.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sbx = "sbx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["broker", "control", "runtime", "src/sbx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["broker", "control", "runtime", "src", "tests"]
# P0 spike is orchestrator-owned and not a CI dependency (SOR-43/44/45).
extend-exclude = ["spike"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
