openapi: 3.1.0
info:
  title: sbx-browser Public API v1
  version: 1.0.0
  description: |
    公开 REST API，形状对齐 Cursor Cloud Agents API（设计 v2 §3.4）。
    `agent ≙ session`，`run ≙ turn`：创建 agent 立刻跑首个 run，follow-up
    是同一 agent 上的新 run。
    认证：`Authorization: Bearer sbx_<key>`（控制面只存 `sha256(key)`）。
    scopes：`agents`（默认）/ `admin`（accounts / api-keys / verify 需要）。
    错误体统一 `{error:{code, message, retry_after?}}`；`code` 取 canonical
    `error_subcodes`，HTTP 状态取 canonical `error_codes`。
    Run 终态另带结构化 `error`（`RunError`：`code/source/message/retryable/
    retry_after?`），`code` 取 canonical `run_error_codes`，`source` 取
    `run_error_sources`；调用方无需解析 SSE 即可诊断失败主因。
    SSE 帧与 `/api/*` 相同：`id: <events.jsonl 行号>` / `event: <type>` /
    `data: <json>`，15 s `: keepalive`，支持 `Last-Event-ID` 续传。
x-canonical:
  error_codes: [400, 401, 403, 404, 409, 429]
  run_error_codes:
    - auth_invalid
    - rate_limited
    - quota_exhausted
    - model_unavailable
    - model_capacity
    - provider_unavailable
    - runtime_error
    - event_parse_error
    - timeout
    - cancelled
    - contract_violation
  run_error_sources: [provider, runtime, control, telemetry]
  error_subcodes:
    - unauthorized
    - forbidden
    - not_found
    - invalid_provider
    - turn_in_progress
    - session_not_runnable
    - account_busy
    - account_unavailable
    - provider_exhausted
    - concurrency_limit
    - idempotency_conflict
    - idempotency_in_progress
    - workspace_invalid
    - workspace_not_found
    - repo_unavailable
    - checkout_failed
    - base_sha_mismatch
    - head_sha_mismatch
    - checksum_mismatch
    - artifact_not_found
    - artifact_invalid
    - artifact_secret
    - review_required
    - invalid_output_contract
    - invalid_resource
    - unsupported
  providers: [codex, antigravity, grok, opencode, devin]
  keepalives_s: 15
  sse:
    id: events.jsonl line number
    event: type
    data: json
    keepalive: ": keepalive"
  paths:
    - inbox/<n>.md
    - turns/<n>.json
    - events.jsonl
    - events.raw.jsonl
    - session.json
  exit_codes:
    "0": success
    "2": cli_nonzero
    "3": timeout
    "4": bad_json
    "5": auth_invalid
  commands:
    - init
    - turn
    - stop
    - export-credentials
  codex_events:
    - thread.started
    - turn.started
    - item.started
    - item.updated
    - item.completed
    - turn.completed
    - turn.failed
    - error
  item_types:
    - agent_message
    - command_execution
    - file_change
    - reasoning
    - error
  runner_events:
    - sbx.turn_started
    - sbx.turn_finished
    - sbx.error
    - sbx.session_meta
  usage_fields:
    - input_tokens
    - cached_input_tokens
    - output_tokens
  usage_fields_optional:
    - cache_write_input_tokens
    - reasoning_output_tokens
  http_paths:
    - POST /v1/agents
    - GET /v1/agents
    - GET /v1/agents/{id}
    - DELETE /v1/agents/{id}
    - POST /v1/agents/{id}/runs
    - GET /v1/agents/{id}/runs
    - GET /v1/agents/{id}/runs/{runId}
    - GET /v1/agents/{id}/runs/{runId}/stream
    - POST /v1/agents/{id}/runs/{runId}/cancel
    - GET /v1/agents/{id}/usage
    - GET /v1/workflows/{id}
    - DELETE /v1/workflows/{id}
    - GET /v1/models
    - GET /v1/me
    - GET /v1/accounts
    - POST /v1/accounts
    - GET /v1/accounts/{id}
    - DELETE /v1/accounts/{id}
    - POST /v1/accounts/{id}/verify
    - GET /v1/api-keys
    - POST /v1/api-keys
    - DELETE /v1/api-keys/{id}
    - GET /v1/agents/{id}/workspace
    - POST /v1/agents/{id}/workspace/review
    - POST /v1/agents/{id}/handoff
    - POST /v1/agents/{id}/git/publish
    - POST /v1/agents/{id}/git/merge
    - POST /v1/agents/{id}/artifacts
    - GET /v1/artifacts
    - GET /v1/artifacts/{artifactId}
    - GET /v1/artifacts/{artifactId}/download
    - GET /v1/github/app
    - POST /v1/github/app/authorize
    - POST /v1/github/app/authorize/callback
    - POST /v1/github/app/sync
    - DELETE /v1/github/app/installations/{installationId}
servers:
  - url: https://sbx.sorenforge.com
    description: Production (Cloudflare Worker → sbx-control)
security:
  - bearerAuth: []
tags:
  - name: agents
  - name: runs
  - name: workspaces
  - name: artifacts
  - name: accounts
  - name: api-keys
  - name: github
  - name: meta
paths:
  /v1/agents:
    post:
      tags: [agents]
      summary: Create an agent and immediately queue its first run
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/Exhausted"
    get:
      tags: [agents]
      summary: List agents
      operationId: listAgents
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProviderId"
        - name: account_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgentStatus"
        - name: workflow_id
          in: query
          required: false
          description: |
            SOR-84 workflow scope filter: only agents whose persisted
            ``metadata.workflow_id`` binding (under the caller's key) matches.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Agent page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/agents/{id}:
    get:
      tags: [agents]
      summary: Get agent detail
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [agents]
      summary: Close an agent (reclaim sandbox; history stays read-only)
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Closed agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/workspace:
    get:
      tags: [workspaces]
      summary: Durable workspace record (SOR-83)
      description: |
        Declared base (`base_sha`/`base_ref`), the actual `checkout_sha` the
        sandbox stands on, current `head_sha`, and `reviewed_head_sha` — the
        commit an independent reviewer pinned. 404 `workspace_not_found`
        when the agent declared no workspace.
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Workspace record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/workspace/review:
    post:
      tags: [workspaces]
      summary: Pin the reviewed head sha (SOR-83)
      description: |
        Records `reviewed_head_sha` — the exact commit a reviewer signed
        off. `head_sha` omitted means "the recorded head"; an explicit value
        that disagrees with it is an explicit 409 `head_sha_mismatch`,
        never a silent mislabel. `comment` (SOR-128) additionally posts a
        machine-readable comment on the workspace's recorded pull request —
        never a formal GitHub review approval: every sandbox shares one
        GitHub identity, so an approval would read as the PR author
        approving their own work. Commenting requires the agent's live
        sandbox and the opt-in GitHub bridge.
      operationId: reviewWorkspace
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewWorkspaceRequest"
      responses:
        "200":
          description: Updated workspace record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/handoff:
    post:
      tags: [workspaces]
      summary: Apply a cross-agent handoff into a live workspace (SOR-83/SOR-128)
      description: |
        Exactly one of `artifact_id` / `head_sha` / `pull_request`.
        `artifact_id` applies a durable artifact package after validating
        repo identity, payload checksum and that the workspace stands
        exactly on the artifact's declared `base_sha`; `head_sha` checks
        out an exact commit that must descend from the declared base;
        `pull_request` fetches a remote ref pinned to an exact head — a ref
        that drifted since the pin fails closed as 409 `head_sha_mismatch`
        (SOR-128 reviewer start). `workspace` supplies a WorkspaceDecl only
        when the agent has no recorded workspace yet. The agent must be
        `idle` with a live sandbox — a running turn is 409
        `turn_in_progress`; a base gap is 409 `base_sha_mismatch`.
      operationId: applyHandoff
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffRef"
      responses:
        "200":
          description: Workspace record after the handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/git/publish:
    post:
      tags: [workspaces]
      summary: Publish the work branch per the declared git policy (SOR-128)
      description: |
        Executes the `git` policy declared at agent create: refreshes the
        recorded head, pushes the work branch to the workspace repo's
        remote and verifies the remote resolved to exactly the pushed head
        — drift fails closed as 409 `repo_unavailable`. When the policy's
        `auto_create_pr` is set, opens the pull request to `target` via the
        opt-in GitHub bridge and records structured `pull_request`
        metadata. `pushed_head_sha`/`pull_request` persist on the durable
        workspace record so a reviewer can pin the exact published head.
        The agent must be `idle` with a live sandbox; an agent without a
        push-enabled `git` policy is 400 `workspace_invalid`.
      operationId: publishGit
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Workspace record after publish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/git/merge:
    post:
      tags: [workspaces]
      summary: Merge the recorded pull request — review-gated (SOR-178)
      description: |
        Merges the pull request recorded on the workspace. Requires the
        `git.merge` flag declared at create, a recorded `pull_request`, and
        an independent exact-sha review pin (`reviewed_head_sha` set via
        `POST /v1/agents/{id}/workspace/review`): no pin is 409
        `review_required`; the recorded PR head and the remote PR ref must
        both still equal the pin — any drift is 409 `head_sha_mismatch`
        and requires a fresh review. The merge is issued to GitHub with
        the pinned sha as its required-head check, so it also fails
        closed server-side. Durable `merge` metadata (`merge_commit_sha`,
        `head_sha`, `merged_at`) is persisted on the workspace record.
        The agent must be `idle` with a live sandbox; an agent without a
        merge-enabled `git` policy or recorded PR is 400
        `workspace_invalid`.
      operationId: mergeGit
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Workspace record after merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/artifacts:
    post:
      tags: [artifacts]
      summary: Snapshot the agent's workspace into a durable artifact (SOR-83)
      description: |
        Collects the declared workspace while the sandbox is still alive so
        the package outlives teardown. The manifest records base/head shas,
        per-file sha256, producer identity and any `test_command` result;
        the package members are `manifest.json`, `patch.diff` (working-tree
        delta vs `checkout_sha`), `repo.bundle` when the worktree is clean
        and HEAD moved, and `files/<path>` for every collected file.
        `run_id` (default: the last run) gets an `artifact://<id>` ref on
        its durable run record. Secret material in scope fails closed:
        409 `artifact_secret`, nothing persisted.
      operationId: createArtifact
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Artifact manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/artifacts:
    get:
      tags: [artifacts]
      summary: List durable artifact manifests (SOR-83)
      operationId: listArtifacts
      parameters:
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by producing agent.
      responses:
        "200":
          description: Artifact manifests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/artifacts/{artifactId}:
    get:
      tags: [artifacts]
      summary: Artifact manifest detail (SOR-83)
      operationId: getArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/artifacts/{artifactId}/download:
    get:
      tags: [artifacts]
      summary: Download one package member (SOR-83)
      description: |
        Raw bytes of `manifest.json`, `patch.diff`, `repo.bundle` or
        `files/<path>`; checksum-verified on read. Served from the durable
        store — works after the producing sandbox is reclaimed.
      operationId: downloadArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - name: member
          in: query
          required: false
          schema:
            type: string
            default: patch.diff
      responses:
        "200":
          description: Member bytes (`application/octet-stream`)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/runs:
    post:
      tags: [runs]
      summary: Follow-up run on an existing agent
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Agent already running (`turn_in_progress`) or closed (`session_not_runnable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    get:
      tags: [runs]
      summary: List runs of an agent
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/runs/{runId}:
    get:
      tags: [runs]
      summary: Get run status and result
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/runs/{runId}/stream:
    get:
      tags: [runs]
      summary: SSE stream of canonical events for this run
      operationId: streamRun
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          description: events.jsonl 行号；从下一行续传
          schema:
            type: string
      responses:
        "200":
          description: |
            `text/event-stream`. Frames identical to `/api/sessions/{id}/events`:

            ```
            id: <events.jsonl 1-based line number>
            event: <type>
            data: <json>

            ```

            `: keepalive` comment on connect, then every 15 s.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/runs/{runId}/cancel:
    post:
      tags: [runs]
      summary: Cancel a running run (= P1 stop)
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run marked CANCELLED (or already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/usage:
    get:
      tags: [agents]
      summary: Accumulated usage and cost for an agent
      operationId: getAgentUsage
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Usage totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workflows/{id}:
    get:
      tags: [agents]
      summary: Workflow query / recover read (SOR-84)
      description: |
        Low-cost recovery view keyed by ``(caller key id, workflow_id)``:
        bound agents, their latest runs and artifact refs, plus aggregate
        progress — everything a fresh client process needs to resume
        polling/streaming after losing local state. Served from persisted
        records only; no sandbox I/O.
      operationId: getWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [agents]
      summary: Scoped workflow cleanup (SOR-84)
      description: |
        Close exactly the agents bound to ``(caller key id, workflow_id)`` —
        other workflows and other principals' sessions are never touched
        (the session owner is re-checked before close). Idempotent: a repeat
        call reports ``already_terminal`` instead of re-closing.
      operationId: deleteWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cleanup outcome per scoped agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowCleanupResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/models:
    get:
      tags: [meta]
      summary: Available models per provider with free account counts
      operationId: listModels
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/capabilities:
    get:
      tags: [meta]
      summary: Per-account capability catalog (SOR-204)
      description: |
        Provider → account → model catalog used by the console's
        Create Agent linking. Reads serve the last-good report
        (CLI-discovered or the account's declared models) — they never
        trigger discovery; refresh is the explicit admin endpoint.
        `stale` marks reports past TTL or invalidated by a
        credential/CLI change.
      operationId: listCapabilities
      responses:
        "200":
          description: Capability catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/capabilities/refresh:
    post:
      tags: [admin]
      summary: Refresh every account's capability report (SOR-204)
      description: |
        Re-runs authenticated provider-CLI discovery for all accounts on
        the deployment's enabled providers. Accounts whose discovery
        fails keep their last-good report, marked `stale` with the
        error recorded.
      operationId: refreshCapabilities
      responses:
        "200":
          description: Refreshed capability catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/accounts/{id}/capabilities/refresh:
    post:
      tags: [admin]
      summary: Refresh one account's capability report (SOR-204)
      operationId: refreshAccountCapabilities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The account's capability report
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    $ref: "#/components/schemas/AccountCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me:
    get:
      tags: [meta]
      summary: API key identity and scopes
      operationId: getMe
      responses:
        "200":
          description: Key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/accounts:
    get:
      tags: [accounts]
      summary: List accounts (admin scope; never returns credentials)
      operationId: listAccountsV1
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProviderId"
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [accounts]
      summary: Import an account credential (admin scope)
      operationId: createAccountV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Created (credential never echoed back)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/accounts/{id}:
    get:
      tags: [accounts]
      summary: Get account (admin scope)
      operationId: getAccountV1
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [accounts]
      summary: Remove an account and its credential (admin scope)
      operationId: deleteAccountV1
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/accounts/{id}/verify:
    post:
      tags: [accounts]
      summary: Probe account credential in a throwaway sandbox (admin scope)
      operationId: verifyAccountV1
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Verified account (status updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/api-keys:
    get:
      tags: [api-keys]
      summary: List API keys (admin scope; hashes only)
      operationId: listApiKeysV1
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [api-keys]
      summary: Create an API key (admin scope; plaintext returned once)
      operationId: createApiKeyV1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created; `key` is the only plaintext response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/api-keys/{id}:
    delete:
      tags: [api-keys]
      summary: Revoke an API key (admin scope)
      operationId: deleteApiKeyV1
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/github/app:
    get:
      tags: [github]
      summary: |
        GitHub App authorization posture (SOR-177): whether the App is
        configured (`configured`, `app_slug`), how many installations are
        recorded, and whether the GH_TOKEN/GITHUB_TOKEN compatibility
        bridge can still supply tokens (`bridge_token`). Never returns
        private-key or token material.
      operationId: getGitHubAppStatus
      responses:
        "200":
          description: Authorization posture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAppStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/github/app/authorize:
    post:
      tags: [github]
      summary: |
        Begin one-click authorization (SOR-177): returns the GitHub App
        install URL to open in a browser plus a single-use `state`
        credential (600s TTL) that the callback requires.
      operationId: beginGitHubAppAuthorize
      responses:
        "201":
          description: Authorize URL + state issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAppAuthorize"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
  /v1/github/app/authorize/callback:
    post:
      tags: [github]
      summary: |
        Complete authorization (SOR-177): records the installation the
        operator selected in the browser. `state` is the callback's
        credential — single-use, from the authorize step.
      operationId: completeGitHubAppAuthorize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubAppAuthorizeCallback"
      responses:
        "200":
          description: Installation recorded
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubAppInstallation"
        "400":
          $ref: "#/components/responses/GitHubAppInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/GitHubAppState"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/GitHubAppUpstream"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
  /v1/github/app/sync:
    post:
      tags: [github]
      summary: |
        Refresh installation metadata from GitHub (admin scope): re-reads
        repo selection for every recorded installation and drops installs
        deleted on GitHub.
      operationId: syncGitHubApp
      responses:
        "200":
          description: Synced installation list
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitHubAppInstallation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/GitHubAppUpstream"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
  /v1/github/app/installations/{installationId}:
    delete:
      tags: [github]
      summary: |
        Revoke one installation (admin scope): best-effort delete on
        GitHub, then always forgets the local record and any cached
        installation tokens. Re-running authorize reconnects.
      operationId: revokeGitHubAppInstallation
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revocation outcome
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                  remote_deleted:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer sbx_<key>`. Control plane stores
        `sha256(key)` only; plaintext is returned once at create time.
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ProviderId:
      type: string
      enum: [codex, antigravity, grok, opencode, devin]
    AgentStatus:
      type: string
      enum: [creating, idle, running, closed, timed_out, lost]
      description: Same enum as P1 session status.
    RunStatus:
      type: string
      enum: [CREATING, RUNNING, FINISHED, ERROR, CANCELLED, EXPIRED, UNKNOWN]
      description: |
        Cursor-shaped run state. Terminal states FINISHED/ERROR/CANCELLED/
        EXPIRED are persisted in the run ledger (SOR-82/A1) and never change
        once written — sandbox teardown cannot rewrite them. UNKNOWN means
        the run's outcome is unavailable (no persisted terminal state and no
        readable evidence); it is never inferred as success.
    Usage:
      type: object
      required: [input_tokens, cached_input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_write_input_tokens:
          type: integer
          minimum: 0
        reasoning_output_tokens:
          type: integer
          minimum: 0
    Prompt:
      type: object
      required: [text]
      properties:
        text:
          type: string
    AgentSpec:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        account_id:
          type: string
          description: Account id, or `"auto"` for scheduler pick (default).
          default: "auto"
        model:
          type: string
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          description: |
            SOR-179 canonical reasoning effort, agent-scoped: every run of
            the agent (first and follow-up turns, incl. provider resume)
            executes under this level. SOR-204 widened the ladder to
            `none|minimal|low|medium|high|xhigh|max`; whether a level is
            honored is decided per resolved model from the account's
            authenticated-CLI capability report — an unsupported
            combination is refused as `400 unsupported` at create time,
            never silently ignored. `GET /v1/models` and
            `GET /v1/capabilities` report the levels each model exposes.
    CreateAgentRequest:
      type: object
      required: [prompt, agent]
      properties:
        prompt:
          $ref: "#/components/schemas/Prompt"
        agent:
          $ref: "#/components/schemas/AgentSpec"
        name:
          type: string
        idle_timeout_s:
          type: integer
          minimum: 1
        workspace:
          $ref: "#/components/schemas/WorkspaceDecl"
        handoff:
          $ref: "#/components/schemas/HandoffRef"
        git:
          $ref: "#/components/schemas/GitPolicy"
        metadata:
          $ref: "#/components/schemas/WorkflowMetadata"
        output_contract:
          $ref: "#/components/schemas/OutputContract"
        resources:
          $ref: "#/components/schemas/SessionResources"
        compute:
          $ref: "#/components/schemas/SessionCompute"
    SessionCompute:
      type: object
      description: |
        SOR-181 per-agent sandbox compute sizing — independent of
        `resources` (which names credential/config refs and must not
        carry sizing). `cpu` is a Modal core count or a `[min, max]`
        request/limit pair; `memory_mib` the same in MiB. Scalars pin
        `min == max`; omitted fields resolve to the canonical defaults
        (`cpu=[1, 2]`, `memory_mib=[1024, 8192]`), and an omitted
        `compute` resolves to the full defaults. Malformed, inverted
        (`min > max`), or out-of-bounds values fail as
        `invalid_compute`. The resolved spec is durable session state —
        it survives restarts and recovery, applies on sandbox create and
        snapshot restore, and the cost estimate bills at the declared
        request floor (`cpu[0]` / `memory_mib[0]`).
      properties:
        cpu:
          description: Core count or `[request, limit]` pair.
          anyOf:
            - type: number
              minimum: 0.125
              maximum: 64
            - type: array
              items:
                type: number
              minItems: 1
              maxItems: 2
        memory_mib:
          description: MiB or `[request, limit]` pair.
          anyOf:
            - type: integer
              minimum: 128
              maximum: 262144
            - type: array
              items:
                type: integer
              minItems: 1
              maxItems: 2
    SessionResources:
      type: object
      description: |
        SOR-129 per-agent resource refs declared at create time.
        `secrets` names Modal Secrets attached to this agent's sandbox
        only (allowlist-validated via `SBX_RESOURCE_SECRETS`; account
        `sbx-acct-*` and control-plane credential Secrets are refused as
        `invalid_resource`). `mcp` names MCP server entries in the
        deployment registry (`SBX_MCP_REGISTRY`); resolved config is
        written into the sandbox with `${env:VAR}` indirection — refs are
        names only, never values. MCP refs on a provider with no MCP
        channel (every provider except `devin`) fail as `unsupported`
        rather than being silently ignored. Unknown or disallowed refs
        fail as `invalid_resource`. Injected resources are never returned
        or logged as values and never baked into artifacts/snapshots.
      properties:
        secrets:
          type: array
          items:
            type: string
          description: Modal Secret names (allowlisted session resources).
        mcp:
          type: array
          items:
            type: string
          description: MCP server registry refs.
    OutputContract:
      type: object
      required: [schema]
      description: |
        SOR-130 structured output contract. `schema` is a JSON Schema the
        run's final agent message must satisfy — enforced subset only
        (assertion keywords; `pattern`, `$ref`, `if`/`then`/`else`,
        `patternProperties`, ... are refused as `400
        invalid_output_contract`). `enforcement` selects verdict handling:
        `strict` (default) turns invalid/malformed output into run `ERROR`
        + `contract_violation` — never a silent success; `warn` keeps the
        run `FINISHED` but attaches the same `contract_violation`
        diagnostic. The verdict is computed on the control plane from the
        recorded message and persisted on the terminal run as
        `output_contract` + `structured_output`.
      properties:
        schema:
          type: object
          description: JSON Schema (enforced subset) the output must satisfy.
        enforcement:
          type: string
          enum: [strict, warn]
          default: strict
    GitPolicy:
      type: object
      description: |
        SOR-128 git collaboration policy. Declares the work branch and how
        the head is published; requires a `workspace` declaration. `branch`
        materializes at prepare via `checkout -B` on the declared base.
        `push` publishes `HEAD` to `refs/heads/<branch>` on the workspace
        repo's remote via `POST /v1/agents/{id}/git/publish`; remote drift
        fails closed. `auto_create_pr` opens a PR to `target` through the
        opt-in GitHub bridge and requires `push`. `auto_publish` (SOR-178)
        publishes automatically when a run finishes successfully and
        requires `push`; `merge` allows `POST /v1/agents/{id}/git/merge`
        and requires `auto_create_pr` — the merge still refuses without an
        independent exact-sha review pin. GitHub-backed operations need
        the shared GitHub identity env (opt-in).
      properties:
        branch:
          type: string
          description: Work branch ref name; safe git ref chars only.
        push:
          type: boolean
          description: Publish the head to the remote work branch.
        auto_create_pr:
          type: boolean
          description: Open a pull request after push; requires `push`.
        auto_publish:
          type: boolean
          description: Publish automatically on successful run finish; requires `push`.
        merge:
          type: boolean
          description: Allow review-gated merge via `/git/merge`; requires `auto_create_pr`.
        target:
          type: string
          description: PR base branch; default the workspace `base_ref`.
        draft:
          type: boolean
          description: Open the pull request as a draft.
        title:
          type: string
          description: PR title; default "sbx/<agent_id>".
        body:
          type: string
          description: PR body text.
    WorkspaceDecl:
      type: object
      required: [repo, base_ref, base_sha]
      description: |
        SOR-83 workspace declaration. `base_sha` pins the exact commit the
        run must start on; `base_ref` names where it is expected to sit. A
        resolved `base_ref` that does not equal `base_sha` fails run-1 with
        an explicit `base_sha_mismatch` — the agent is closed rather than
        left running on the wrong version.
      properties:
        repo:
          type: string
          description: Clone URL or path the control plane clones.
        base_ref:
          type: string
        base_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
    PullRequestRef:
      type: object
      required: [ref, head_sha]
      description: |
        SOR-128 remote ref pinned to an exact head — the reviewer-start
        handoff. `ref` is fetched from the workspace repo's remote
        (`refs/pull/<n>/head`, `pull/<n>/head`, or a branch name); the
        resolved sha must equal `head_sha` exactly — drift fails closed as
        `head_sha_mismatch`.
      properties:
        ref:
          type: string
          description: Remote ref to fetch; safe git ref chars only.
        head_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Exact commit the ref must resolve to.
    HandoffRef:
      type: object
      description: |
        SOR-83/SOR-128 cross-agent handoff reference — exactly one of
        `artifact_id` / `head_sha` / `pull_request` required. On
        `POST /v1/agents` a `workspace` declaration must accompany the
        handoff; on `POST /v1/agents/{id}/handoff` `workspace` is only used
        when the agent has no recorded workspace yet.
      properties:
        artifact_id:
          type: string
          description: Durable artifact package to apply.
        head_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Exact commit to check out; must descend from base.
        pull_request:
          $ref: "#/components/schemas/PullRequestRef"
        workspace:
          $ref: "#/components/schemas/WorkspaceDecl"
    CreateArtifactRequest:
      type: object
      properties:
        run_id:
          type: string
          description: "Run to attach `artifact://<id>` to (default: last run)."
        test_command:
          type: string
          description: Command run in the workdir; exit code lands in the manifest.
    ReviewWorkspaceRequest:
      type: object
      properties:
        head_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: |
            Exact commit the reviewer signed off; omitted pins the recorded
            head. A value that disagrees with the recorded head is an
            explicit `head_sha_mismatch`.
        comment:
          type: string
          minLength: 1
          description: |
            SOR-128 machine-readable review comment posted on the
            workspace's recorded pull request. Never a formal GitHub review
            approval — every sandbox shares one GitHub identity, so an
            approval would read as the PR author approving their own work.
            Requires a live sandbox and the opt-in GitHub bridge.
    WorkspaceRecord:
      type: object
      required: [agent_id, repo, base_ref, base_sha]
      properties:
        agent_id:
          type: string
        repo:
          type: string
        base_ref:
          type: string
        base_sha:
          type: string
        workdir:
          type: string
          description: Sandbox-root-relative workdir (default `repo`).
        checkout_sha:
          type: string
          nullable: true
          description: Commit the workspace actually stands on post-prepare.
        head_sha:
          type: string
          nullable: true
          description: Current workdir HEAD as last recorded by the control plane.
        reviewed_head_sha:
          type: string
          nullable: true
          description: Commit an independent reviewer pinned via `/workspace/review`.
        git:
          type: object
          nullable: true
          description: Resolved SOR-128 GitPolicy declared at create.
        branch:
          type: string
          nullable: true
          description: Work branch materialized from the git policy.
        pushed_head_sha:
          type: string
          nullable: true
          description: Exact head last pushed per the git policy.
        pull_request:
          type: object
          nullable: true
          description: |
            SOR-128 PR metadata recorded by publish: `number`, `url`,
            `state`, `ref` (`refs/pull/<n>/head` — the reviewer-start
            handoff ref), `head_sha` (the pinned published head), `base`
            (PR target), `draft`, `review_comment_url`.
        merge:
          type: object
          nullable: true
          description: |
            SOR-178 merge metadata recorded by `/git/merge`: `merged`,
            `merge_commit_sha`, `head_sha` (the reviewed head that was
            merged), `merged_at`.
        publish_error:
          type: string
          nullable: true
          description: |
            SOR-178 last publish failure (`<code>: <message>`), explicit
            or automatic — cleared on the next successful publish.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceResponse:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: "#/components/schemas/WorkspaceRecord"
    Artifact:
      type: object
      required: [artifact_id, format, created_at, producer, files, payloads]
      description: |
        Durable artifact manifest (SOR-83/B1). `payloads` maps member names
        (`patch.diff`, `repo.bundle`) to sha256; `files` lists collected
        workspace files with sha256+size. `download_url` serves any member
        (`manifest.json`, payload members, `files/<path>`).
      properties:
        schema_version:
          type: integer
        artifact_id:
          type: string
        format:
          type: string
          enum: [patch]
        base_sha:
          type: string
          description: Producer checkout_sha — the base the delta applies on.
        head_sha:
          type: string
          description: Producer HEAD at snapshot time.
        repo:
          type: string
        created_at:
          type: string
          format: date-time
        producer:
          type: object
          properties:
            agent_id:
              type: string
            run_id:
              type: string
              nullable: true
        files:
          type: array
          items:
            type: object
            required: [path, sha256, size]
            properties:
              path:
                type: string
              sha256:
                type: string
              size:
                type: integer
        tests:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              exit_code:
                type: integer
        payloads:
          type: object
          additionalProperties:
            type: string
          description: Member name → sha256.
        warnings:
          type: array
          items:
            type: string
        download_url:
          type: string
    ArtifactList:
      type: object
      required: [artifacts]
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
    ArtifactResponse:
      type: object
      required: [artifact]
      properties:
        artifact:
          $ref: "#/components/schemas/Artifact"
    CreateAgentResponse:
      type: object
      required: [agent, run]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        run:
          $ref: "#/components/schemas/Run"
    CreateRunRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          $ref: "#/components/schemas/Prompt"
        metadata:
          $ref: "#/components/schemas/WorkflowMetadata"
        output_contract:
          $ref: "#/components/schemas/OutputContract"
    WorkflowMetadata:
      type: object
      required: [workflow_id, task_id, role]
      description: |
        SOR-84 caller workflow binding. Persisted per agent, keyed by
        ``(api key id, workflow_id)``, so a fresh client can recover a
        workflow from nothing but its API key + ``workflow_id``.
      properties:
        workflow_id:
          type: string
          minLength: 1
          maxLength: 256
        task_id:
          type: string
          minLength: 1
          maxLength: 256
        role:
          type: string
          minLength: 1
          maxLength: 64
          description: Free-form label (``worker`` / ``reviewer`` / ...).
        parent_task_id:
          type: string
          maxLength: 256
          nullable: true
    Agent:
      type: object
      required:
        - id
        - name
        - provider
        - account_id
        - model
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        account_id:
          type: string
        model:
          type: string
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          nullable: true
          description: |
            SOR-179/204: the canonical reasoning effort declared at create
            (inherited by every run), `null` when undeclared.
        status:
          $ref: "#/components/schemas/AgentStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/Usage"
          nullable: true
          description: |
            Token usage measured by runs; ``null`` while unmeasured —
            unavailable, never fabricated zeros (SOR-84).
        cost_estimate_usd:
          type: number
        metadata:
          $ref: "#/components/schemas/WorkflowMetadata"
          nullable: true
          description: The persisted workflow binding, when attached.
        resources:
          $ref: "#/components/schemas/SessionResources"
          nullable: true
          description: |
            SOR-129: the declared session-resource refs (names only —
            never values), ``null`` when the agent declared none.
        compute:
          $ref: "#/components/schemas/SessionCompute"
          nullable: true
          description: |
            SOR-181: the resolved compute spec the agent's sandbox was
            created with — ``{cpu: [min, max], memory_mib: [min, max]}``
            with the canonical defaults filled in, ``null`` only for
            records predating SOR-181.
    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        next_cursor:
          type: string
          nullable: true
    Run:
      type: object
      required: [id, agent_id, status, created_at, updated_at]
      properties:
        id:
          type: string
        agent_id:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          properties:
            text:
              type: string
        error:
          $ref: "#/components/schemas/RunError"
        usage:
          $ref: "#/components/schemas/Usage"
        provider:
          $ref: "#/components/schemas/ProviderId"
          nullable: true
        account_id:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          nullable: true
          description: |
            SOR-179/204: the effective canonical effort the run executed
            under (the agent's declared level), `null` when undeclared.
        artifact_refs:
          type: array
          items:
            type: string
          description: |
            Sandbox-relative evidence paths for this run
            (``turns/<n>.json``, ``inbox/<n>.md``, ``events.jsonl``,
            ``events.raw.jsonl``). Refs may be dangling after the sandbox is
            reclaimed; the ledger record is the durable truth.
        structured_output:
          nullable: true
          description: |
            SOR-130: the JSON value extracted from the run's final agent
            message — any JSON type. ``null`` when the run carried no
            output contract or the message held no parseable JSON.
        output_contract:
          $ref: "#/components/schemas/OutputContractResult"
    RunError:
      type: object
      nullable: true
      required: [code, source, message, retryable]
      description: |
        结构化 run 失败原因（SOR-82）。`code` 为 canonical
        `run_error_codes`；`source` 区分 provider / runtime / control /
        telemetry；`message` 为脱敏后的诊断文本；`retryable` 表示换个时机
        （或换个账号/model）重试可能成功；`retry_after` 为 provider 给出的
        秒级重试提示（仅 `rate_limited` 等在可知时出现）。
        `event_parse_error` 表示事件流解析失败——除非执行完整性被独立确认，
        否则不得降级为 warning 或视为成功。持久化在 run ledger 上的错误
        使用同一 canonical 形状。
      properties:
        code:
          type: string
          enum:
            - auth_invalid
            - rate_limited
            - quota_exhausted
            - model_unavailable
            - model_capacity
            - provider_unavailable
            - runtime_error
            - event_parse_error
            - timeout
            - cancelled
            - contract_violation
        source:
          type: string
          enum: [provider, runtime, control, telemetry]
        message:
          type: string
        retryable:
          type: boolean
        retry_after:
          type: number
          description: Seconds; present when the provider supplied a retry hint
    OutputContractResult:
      type: object
      nullable: true
      required: [enforcement, status]
      description: |
        SOR-130 output-contract verdict persisted on a run. ``status`` is
        ``pending`` while the run is open, ``valid`` / ``invalid`` once the
        terminal verdict is evaluated, ``skipped`` when the run ended
        without evaluable output. ``violations`` is a bounded list of
        machine-diagnosable ``{path, code, message}`` entries — an
        ``invalid`` verdict under ``strict`` enforcement also surfaces as
        run ``ERROR`` + ``contract_violation``.
      properties:
        schema:
          type: object
          nullable: true
          description: The requested JSON Schema (echoed for diagnosis).
        enforcement:
          type: string
          enum: [strict, warn]
        schema_digest:
          type: string
          nullable: true
          description: '"sha256:<hex>" over the canonical schema.'
        status:
          type: string
          enum: [pending, valid, invalid, skipped]
        extraction:
          type: string
          nullable: true
          enum: [raw, fence, embedded]
          description: How the JSON value was recovered from the message.
        violations:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
    AgentUsage:
      type: object
      required: [usage, cost_estimate_usd, sandbox_seconds]
      properties:
        usage:
          $ref: "#/components/schemas/Usage"
          nullable: true
          description: "``null`` while no usage was ever measured (SOR-84)."
        cost_estimate_usd:
          type: number
        sandbox_seconds:
          type: number
    WorkflowAgent:
      type: object
      required: [agent_id, task_id, role, status, runs, latest_run]
      description: One bound agent inside a workflow view (SOR-84).
      properties:
        agent_id:
          type: string
        task_id:
          type: string
        role:
          type: string
        parent_task_id:
          type: string
          nullable: true
        attached_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AgentStatus"
          description: Session status; ``missing`` when the record is gone.
        provider:
          $ref: "#/components/schemas/ProviderId"
          nullable: true
        account_id:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        agent_created_at:
          type: string
          format: date-time
          nullable: true
        runs:
          type: integer
        latest_run:
          $ref: "#/components/schemas/Run"
          nullable: true
    Workflow:
      type: object
      required: [workflow_id, agents, progress]
      properties:
        workflow_id:
          type: string
        agents:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowAgent"
        progress:
          type: object
          required: [tasks, agents, open_agents, runs, latest_runs_by_status, all_terminal]
          properties:
            tasks:
              type: integer
            agents:
              type: integer
            open_agents:
              type: integer
            runs:
              type: integer
            latest_runs_by_status:
              type: object
              additionalProperties:
                type: integer
            all_terminal:
              type: boolean
    WorkflowCleanupResult:
      type: object
      required:
        - workflow_id
        - matched
        - closed
        - already_terminal
        - missing
        - skipped
        - errors
      properties:
        workflow_id:
          type: string
        matched:
          type: integer
        closed:
          type: array
          items:
            type: string
        already_terminal:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: string
          description: Agents whose session owner differs — never closed.
        errors:
          type: object
          additionalProperties:
            type: string
    Model:
      type: object
      required: [provider, model, accounts_available]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        model:
          type: string
        accounts_available:
          type: integer
          minimum: 0
        reasoning_efforts:
          type: array
          items:
            type: string
            enum: [none, minimal, low, medium, high, xhigh, max]
          description: |
            SOR-179/204: canonical reasoning-effort levels this model
            exposes per the account's capability report. Empty means the
            model has no effort surface — a declared `reasoning_effort`
            on agent create is refused as `unsupported`, never ignored.
        display:
          type: string
          description: Human-facing model name reported by the CLI.
        family:
          type: string
          description: Model family (SOR-204), e.g. `swe-2`.
        default_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          nullable: true
          description: Provider-reported default effort when set.
        source:
          type: string
          enum: [cli, declared]
          description: |
            SOR-204 truth source: `cli` = authenticated provider CLI
            discovery, `declared` = the account's declared model list.
        stale:
          type: boolean
          description: |
            Last-good report past its TTL or invalidated by a
            credential/CLI change — still served, marked stale.
    ModelCapability:
      type: object
      required: [model, display, family, aliases, reasoning_efforts, availability]
      properties:
        model:
          type: string
        display:
          type: string
        family:
          type: string
        aliases:
          type: array
          items:
            type: string
        reasoning_efforts:
          type: array
          items:
            type: string
            enum: [none, minimal, low, medium, high, xhigh, max]
        default_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          nullable: true
        availability:
          type: string
          enum: [available, unavailable]
        free:
          type: boolean
          description: Zero-cost tier (e.g. OpenCode Zen free models).
    AccountCapabilities:
      type: object
      required: [account_id, provider, source, refreshed_at, stale, models]
      properties:
        account_id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        source:
          type: string
          enum: [cli, declared]
        refreshed_at:
          type: string
          format: date-time
          nullable: true
        stale:
          type: boolean
        plan:
          type: string
          nullable: true
          description: Account subscription/tier when the CLI reports it.
        families:
          type: array
          items:
            type: string
        cli_version:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
          description: Discovery error recorded on a last-good report.
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelCapability"
    CapabilityCatalog:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [provider, accounts]
            properties:
              provider:
                $ref: "#/components/schemas/ProviderId"
              accounts:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/AccountCapabilities"
                    - type: object
                      properties:
                        id:
                          type: string
                          description: Same id as `account_id`.
                        label:
                          type: string
                        status:
                          $ref: "#/components/schemas/AccountStatus"
                        running:
                          type: integer
                        max_concurrent:
                          type: integer
    Me:
      type: object
      required: [key_id, scopes]
      properties:
        key_id:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [agents, admin]
    AccountStatus:
      type: string
      enum: [active, cooling, invalid, disabled]
    Account:
      type: object
      required: [id, provider, label, status, max_concurrent]
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        label:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        max_concurrent:
          type: integer
          minimum: 1
        running:
          type: integer
          minimum: 0
        models:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        cooldown_until:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
          description: REDACTED short code only, never credential material
    CreateAccountRequest:
      type: object
      required: [provider, label]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        label:
          type: string
        credential:
          type: object
          description: |
            Credential blob `{"files": {"<relpath under HOME>": "<content>"}}`.
            Transported over HTTPS only; never logged or returned.
          properties:
            files:
              type: object
              additionalProperties:
                type: string
        max_concurrent:
          type: integer
          minimum: 1
        models:
          type: array
          items:
            type: string
    ApiKey:
      type: object
      required: [id, label, scopes, created_at]
      properties:
        id:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [agents, admin]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    CreateApiKeyRequest:
      type: object
      properties:
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [agents, admin]
          default: [agents]
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: "`sbx_<key>` plaintext, returned exactly once"
    GitHubAppInstallation:
      type: object
      description: |
        Selected-repo authorization metadata for one GitHub App
        installation (SOR-177). Metadata only — never token material.
        `repositories` is populated only when `repository_selection` is
        `selected`; `all` covers every repo on the account.
      required: [installation_id, account_login, repository_selection, suspended]
      properties:
        installation_id:
          type: integer
        account_login:
          type: string
        account_type:
          type: string
          enum: [User, Organization]
        repository_selection:
          type: string
          enum: [all, selected]
        repositories:
          type: array
          items:
            type: string
        suspended:
          type: boolean
        recorded_at:
          type: string
          format: date-time
        synced_at:
          type: string
          format: date-time
    GitHubAppStatus:
      type: object
      required: [configured, installable, installations, bridge_token]
      properties:
        configured:
          type: boolean
          description: App id + private key present (JWT can be signed)
        installable:
          type: boolean
          description: App slug also present (authorize URL can be built)
        app_id:
          type: string
          nullable: true
        app_slug:
          type: string
          nullable: true
        installations:
          type: array
          items:
            $ref: "#/components/schemas/GitHubAppInstallation"
        bridge_token:
          type: boolean
          description: |
            Whether the GH_TOKEN/GITHUB_TOKEN compatibility fallback can
            still supply tokens to the injection seam.
    GitHubAppAuthorize:
      type: object
      required: [authorize_url, state, expires_at]
      properties:
        authorize_url:
          type: string
          description: GitHub App install URL to open in a browser
        state:
          type: string
          description: Single-use callback credential (600s TTL)
        expires_at:
          type: string
          format: date-time
    GitHubAppAuthorizeCallback:
      type: object
      required: [installation_id, state]
      properties:
        installation_id:
          type: integer
        state:
          type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - invalid_provider
                - turn_in_progress
                - session_not_runnable
                - account_busy
                - account_unavailable
                - provider_exhausted
                - concurrency_limit
                - idempotency_conflict
                - idempotency_in_progress
                - workspace_invalid
                - workspace_not_found
                - repo_unavailable
                - checkout_failed
                - base_sha_mismatch
                - head_sha_mismatch
                - checksum_mismatch
                - artifact_not_found
                - artifact_invalid
                - artifact_secret
                - review_required
                - invalid_output_contract
                - github_app_unconfigured
                - github_app_invalid
                - github_app_state
                - github_app_upstream
            message:
              type: string
            retry_after:
              type: number
              description: Seconds; present on `provider_exhausted` / `concurrency_limit` when known
  responses:
    Unauthorized:
      description: Missing or invalid Bearer key (401 unauthorized)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Valid key without the required `admin` scope (403 forbidden)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Resource not found (404 not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    WorkspaceConflict:
      description: |
        409 workspace/artifact domain failure (SOR-83):
        `workspace_not_found`, `repo_unavailable`, `checkout_failed`,
        `base_sha_mismatch`, `head_sha_mismatch`, `checksum_mismatch`,
        `artifact_invalid`, `artifact_secret`, or `review_required` —
        always explicit, never a silent mislabel or redact-and-ship.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InvalidProvider:
      description: Unknown provider or malformed request (400 invalid_provider)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    AccountUnavailable:
      description: |
        409 when a named account cannot take the run: `account_busy`
        (no free slot) or `account_unavailable` (not `active`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Exhausted:
      description: |
        429 when capacity is exhausted: `provider_exhausted` (auto pick found
        no free account) or `concurrency_limit` (global cap). `retry_after`
        in the error body when known.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppUnconfigured:
      description: |
        503 github_app_unconfigured — no GitHub App identity/private key is
        configured (SOR-177). The GH_TOKEN compatibility bridge may still
        supply tokens.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppInvalid:
      description: |
        400 github_app_invalid — malformed authorize callback (bad
        installation_id / missing state).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppState:
      description: |
        403 github_app_state — the authorize `state` is absent, unknown,
        expired, or already consumed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppUpstream:
      description: |
        502 github_app_upstream — a GitHub API call failed (installations
        list, repo selection, installation-token mint, delete).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
